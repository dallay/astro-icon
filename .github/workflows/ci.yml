name: CI

on:
  push:
    branches:
      - 'main'
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install

      # Bot and fork PRs have no write access for lint auto-fixes.
      - name: Lint (check only for bots and forks)
        if: |
          contains(github.actor, '[bot]') ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.owner.login != github.repository_owner)
        run: pnpm run lint

      # Auto-fix + commit on main and same-repository human pull requests.
      - name: Lint (auto-fix)
        if: |
          !contains(github.actor, '[bot]') &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.owner.login == github.repository_owner)
        run: pnpm run lint:fix || true

      - name: Commit lint fixes
        if: |
          !contains(github.actor, '[bot]') &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.owner.login == github.repository_owner)
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No lint fixes needed."
            exit 0
          fi
          git add -A
          git commit -m "chore(lint): biome auto-fix"
          # actions/checkout leaves a detached HEAD on PR events.
          # Push back to the source branch explicitly; --force-with-lease
          # prevents overwriting concurrent pushes that aren't ours.
          if [ -n "$HEAD_REF" ]; then
            git push origin "HEAD:${HEAD_REF}" --force-with-lease
          else
            git push
          fi

  smoke:
    name: Smoke Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm -r build
